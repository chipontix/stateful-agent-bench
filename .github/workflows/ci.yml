name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make test

  # One task end to end on the runner's own Docker: bug red, reference green,
  # and the stub agents in the no-network container.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v6
      - run: make up deps
      - run: python3 -m bench verify-all --repeat 2 lakehouse-dups-after-rebalance
      - run: python3 -m bench run --agent stub-ref lakehouse-dups-after-rebalance
      - run: python3 -m bench run --agent stub-wrong lakehouse-dups-after-rebalance
      - run: |
          python3 - <<'PY'
          import json
          ref = json.load(open("results/run-stub-ref.json"))["tasks"]["lakehouse-dups-after-rebalance"]
          wrong = json.load(open("results/run-stub-wrong.json"))["tasks"]["lakehouse-dups-after-rebalance"]
          assert ref["correct"] == 1 and wrong["correct"] == 0, (ref, wrong)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: results, path: results/}
