# Shared brokers for every verifier: one Postgres (logical decoding on, for the
# CDC relays) and one single-node Kafka. Same image tags as ledger-saga and
# events-lakehouse use, so nothing extra is pulled if those are already here.
name: sab

services:
  postgres:
    image: postgres:17.6-alpine
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=64, -c, max_wal_senders=64,
              -c, max_connections=400, -c, shared_buffers=256MB]
    environment: {POSTGRES_PASSWORD: postgres}
    ports: ["${SAB_PG_PORT:-23432}:5432"]
    mem_limit: 1g
    tmpfs: [/var/lib/postgresql/data]  # throwaway state: verifiers build fresh databases
    healthcheck: {test: [CMD, pg_isready, -U, postgres], interval: 2s, retries: 30}

  kafka:
    image: apache/kafka:3.9.1
    ports: ["${SAB_KAFKA_PORT:-23092}:9092"]
    mem_limit: 1536m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: -Xms768m -Xmx768m
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${SAB_KAFKA_PORT:-23092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 8
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_MS: 3600000
      KAFKA_LOG_SEGMENT_BYTES: 16777216      # small segments and indexes: verifiers create and drop many topics
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
    tmpfs: [/tmp/kraft-combined-logs]
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
      interval: 5s
      timeout: 20s
      retries: 20
